name: Lint code style issues

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-code-styling: # zizmor: ignore[anonymous-definition]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **.php

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: steps.changed-files.outputs.any_modified == 'true'
        with:
          php-version: 8.5
          coverage: none
          tools: pint:1.16.0

      - name: Check PHP code style issues
        if: steps.changed-files.outputs.any_modified == 'true'
        run: pint --test -v

      - name: Check Statamic\trans imports
        run: bash scripts/check-trans-import.sh
