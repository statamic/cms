name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 20.19.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.19.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: bash ./scripts/build-release.sh

      - name: Get Changelog
        id: changelog
        uses: statamic/changelog-action@5d112d0d790cdeeb5adca3e584e37edc474ab51b # v1
        with:
          version: ${{ github.ref }}

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.changelog.outputs.version }}
          name: ${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.text }}
          files: |
            ./resources/dist.tar.gz
            ./resources/dist-dev.tar.gz
            ./resources/dist-frontend.tar.gz
            ./resources/dist-package.tar.gz

      - name: Deploy Storybook to Forge
        continue-on-error: true
        run: |
          curl -X POST "${{ secrets.FORGE_STORYBOOK_WEBHOOK }}"
