name: Run Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  php-tests:
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            php: 8.5
            laravel: 12.*
            stability: prefer-stable

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          files: |
            config/**
            lang/**
            resources/users/**
            resources/views/**
            routes/**
            src/**
            tests/**
            composer.json
            phpunit.xml.dist
            .github/workflows/tests.yml
            **.php

      - name: Determine whether tests should run
        id: should-run-tests
        if: steps.changed-files.outputs.any_modified == 'true' || github.event_name == 'schedule'
        run: |
          echo "result=true" >> $GITHUB_OUTPUT
          echo "result=true" >> $env:GITHUB_OUTPUT

      - name: Update apt sources
        if: steps.should-run-tests.outputs.result == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get check || sudo apt --fix-broken install -y
          sudo apt-get update

      - name: Install French Locale
        if: steps.should-run-tests.outputs.result == 'true' && matrix.os == 'ubuntu-latest'
        run: sudo apt-get install language-pack-fr

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        if: steps.should-run-tests.outputs.result == 'true'
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, exif, gd, pdo, sqlite, pdo_sqlite
          ini-values: short_open_tag=on
          coverage: none
          # Pass an empty token so setup-php doesn't write GITHUB_TOKEN into
          # Composer's auth config. Composer 2.9.7's regex rejects the new
          # GITHUB_TOKEN format (composer/composer#12849).
          github-token: ''

      - name: Install dependencies
        uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        if: steps.should-run-tests.outputs.result == 'true'
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: |
            composer require "illuminate/contracts:${{ matrix.laravel }}" --dev --no-interaction --no-update
            composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        if: steps.should-run-tests.outputs.result == 'true'
        run: composer show -D

      - name: Execute tests
        if: steps.should-run-tests.outputs.result == 'true'
        run: vendor/bin/phpunit

  js-tests:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    name: JavaScript tests

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          files: |
            **/*.{js,vue,ts}
            package.json
            .github/workflows/tests.yml

      - name: Determine whether tests should run
        id: should-run-tests
        if: steps.changed-files.outputs.any_modified == 'true' || github.event_name == 'schedule'
        run: |
          echo "result=true" >> $GITHUB_OUTPUT
          echo "result=true" >> $env:GITHUB_OUTPUT

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4

      - name: Install dependencies
        if: steps.should-run-tests.outputs.result == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.should-run-tests.outputs.result == 'true'
        run: npx playwright install chromium

      - name: Execute tests
        if: steps.should-run-tests.outputs.result == 'true'
        run: npm run test
        env:
          CI: true
          LARAVEL_BYPASS_ENV_CHECK: 1
          LANG: en_US.UTF-8

      - name: Verify build succeeds
        if: steps.should-run-tests.outputs.result == 'true'
        run: npm run build

  slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [php-tests, js-tests]
    if: always()
    steps:
      - uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # v3
      - name: Send Slack notification
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3
        if: env.WORKFLOW_CONCLUSION == 'failure' && github.event_name == 'schedule'
        with:
          status: failure
          fields: repo,message,commit,author,action,eventName,ref,workflow
          author_name: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
