{{ once }}
    <link rel="stylesheet" href="{{ config:app:url }}/vendor/statamic/forms/image-choice.css">
{{ /once }}
<fieldset
    class="image-choice"
    style="--image-choice-columns: {{ columns ?? 3 }};"
    {{ unless multiple }}role="radiogroup"{{ /unless }}
    {{ if multiple }}role="group"{{ /if }}
>
    {{ image_options }}
        <label class="image-choice__option{{ if multiple }}{{ if value|in_array:key }} image-choice__option--selected{{ /if }}{{ else }}{{ if value == key }} image-choice__option--selected{{ /if }}{{ /if }}">
            <input
                class="image-choice__input"
                id="{{ id }}-{{ key | slugify }}-option"
                type="{{ multiple ? 'checkbox' : 'radio' }}"
                name="{{ multiple ? '{name}[]' : name }}"
                value="{{ key }}"
                {{ if js_driver }}{{ js_attributes }}{{ /if }}
                {{ if multiple }}
                    {{ if value|in_array:key }}checked{{ /if }}
                {{ else }}
                    {{ if value == key }}checked{{ /if }}
                {{ /if }}
                {{ if validate|contains:required }}required{{ /if }}
                {{ if error }}
                    aria-invalid="true" aria-describedby="{{ id }}-error"
                {{ elseif instructions }}
                    aria-describedby="{{ id }}-instructions"
                {{ /if }}
            >
            <span class="image-choice__card">
                <span class="image-choice__media">
                    {{ if image }}
                        <img class="image-choice__image" src="{{ image }}" alt="{{ label ?? key }}">
                    {{ /if }}
                </span>
                {{ if label }}
                    <span class="image-choice__label">{{ label }}</span>
                {{ /if }}
            </span>
        </label>
    {{ /image_options }}
</fieldset>
