<ul class="flex flex-col gap-2" data-ranking id="{{ id }}" role="list">
    {{ if value }}
        {{ value }}
            {{ label = options[value] ?? value }}
            <li class="flex items-center gap-2 rounded-lg border border-gray-300 bg-white p-2 dark:border-gray-700 dark:bg-gray-900">
                <span class="flex size-6 shrink-0 items-center justify-center rounded-md border border-gray-300 shadow-ui-xs bg-white text-xs font-semibold text-gray-800 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200" aria-hidden="true">{{ index + 1 }}</span>
                <span class="min-w-0 flex-1 text-sm text-gray-800 dark:text-gray-200">{{ label }}</span>
                <input type="hidden" name="{{ name }}[]" value="{{ value }}">
            </li>
        {{ /value }}
    {{ else }}
        {{ foreach:options as="option|label" }}
            <li class="flex items-center gap-2 rounded-lg border border-gray-300 bg-white p-2 dark:border-gray-700 dark:bg-gray-900">
                <span class="flex size-6 shrink-0 items-center justify-center rounded-md border border-gray-300 shadow-ui-xs bg-white text-xs font-semibold text-gray-800 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200" aria-hidden="true">{{ index + 1 }}</span>
                <span class="min-w-0 flex-1 text-sm text-gray-800 dark:text-gray-200">{{ label !== null ? label : option }}</span>
                <input type="hidden" name="{{ name }}[]" value="{{ option }}">
            </li>
        {{ /foreach:options }}
    {{ /if }}
</ul>
